server {
    listen 80;
    server_name _;
    # Redirige todo el tráfico HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy de las llamadas API hacia el BFF (mismo origen -> sin CORS ni mixed content)
    location /api/ {
        proxy_pass http://bff:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        # Mismo origen para el navegador: sin Origin, el BFF no aplica CORS (evita 403 "Invalid CORS request")
        proxy_set_header Origin "";

        # El BFF (gateway manual) envia headers duplicados; los limpiamos para que nginx no de 502
        proxy_hide_header Transfer-Encoding;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        proxy_hide_header Cache-Control;
        proxy_pass_request_headers on;
        proxy_buffering off;
    }

    # SPA: cualquier ruta desconocida devuelve index.html (para el router de Angular)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
